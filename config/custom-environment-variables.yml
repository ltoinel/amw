# Maps environment variables onto configuration keys (node-config mechanism).
# It applies on top of every config/<NODE_ENV>.yml file, so secrets can stay
# out of the repository and out of the Docker image.
#
# node-config never expands ${VAR} placeholders inside regular YAML files:
# this file is the supported way to inject environment variables.
# Unset or empty variables are ignored and the YAML value is kept.
# Values are strings unless `__format: json` is set, which booleans and
# numbers need because the server compares them with strict equality.

Amazon:
  credentialId: AMAZON_CREDENTIAL_ID
  credentialSecret: AMAZON_CREDENTIAL_SECRET
  version: AMAZON_CREDENTIAL_VERSION
  partnerTag: AMAZON_PARTNER_TAG
  marketplace: AMAZON_MARKETPLACE
  breakerThreshold:
    __name: AMAZON_BREAKER_THRESHOLD
    __format: json
  breakerCooldown:
    __name: AMAZON_BREAKER_COOLDOWN
    __format: json

Server:
  port:
    __name: SERVER_PORT
    __format: json
  debug:
    __name: SERVER_DEBUG
    __format: json
  path: SERVER_PATH
  cors:
    __name: SERVER_CORS
    __format: json
  projectDir: SERVER_PROJECT_DIR
  rateLimit:
    __name: SERVER_RATE_LIMIT
    __format: json
  swagger:
    __name: SERVER_SWAGGER
    __format: json
  metrics:
    __name: SERVER_METRICS
    __format: json
  clickRateLimit:
    __name: SERVER_CLICK_RATE_LIMIT
    __format: json
  # JSON: 1, false, or a list of trusted addresses such as ["loopback","10.0.0.0/8"]
  trustProxy:
    __name: SERVER_TRUST_PROXY
    __format: json

Redis:
  enabled:
    __name: REDIS_ENABLED
    __format: json
  host: REDIS_HOST
  port:
    __name: REDIS_PORT
    __format: json
  password: REDIS_PASSWORD
  username: REDIS_USERNAME
  staleExpire:
    __name: REDIS_STALE_EXPIRE
    __format: json
  notFoundExpire:
    __name: REDIS_NOT_FOUND_EXPIRE
    __format: json

# AMW_ADMIN_PASSWORD and AMW_ADMIN_SECRET are read by the server straight from
# the environment and deliberately have no configuration key.
Admin:
  enabled:
    __name: AMW_ADMIN_ENABLED
    __format: json
  tokenTtl:
    __name: AMW_ADMIN_TOKEN_TTL
    __format: json
  loginRateLimit:
    __name: AMW_ADMIN_LOGIN_RATE_LIMIT
    __format: json
