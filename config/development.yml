# Configuration for development (NODE_ENV=development: `npm run dev` and
# docker/docker-compose.dev.yml).
# This file is committed, so it must never hold credentials: put them in a
# git-ignored .env file (see .env.example), custom-environment-variables.yml
# maps them onto these keys.

Amazon:
  credentialId: ""
  credentialSecret: ""
  version: "3.2"
  partnerTag: ""
  marketplace: www.amazon.fr
  condition: New
  # Circuit breaker: after breakerThreshold consecutive Amazon failures, stop
  # calling Amazon for breakerCooldown seconds (stale products are served, or
  # 503 with Retry-After). 0 disables the breaker.
  breakerThreshold: 5
  breakerCooldown: 60

Server:
  port: 8080
  debug: true
  path: /amw
  cors: false
  # Must be absolute (Express sendFile). This is the path inside the dev
  # container; set SERVER_PROJECT_DIR when running `npm run dev` on the host.
  projectDir: /app/
  # Short HTTP cache so that widget changes show up on reload
  httpCache: 60
  rateLimit: 120
  metrics: false
  trustProxy: false

# Disabled so that `npm run dev` works on the host without Redis; the dev
# compose file enables it and points it to its own Redis service.
Redis:
  enabled: false
  host: localhost
  port: 6379
  password: ""
  username: ""
  # Amazon Associates rules require prices less than 24 h old: larger values
  # are capped at 86400.
  expire: 3600
  # Products are kept staleExpire seconds after they expire, to be served when
  # Amazon is down (0 disables it). Never beyond 24 h after the Amazon call.
  staleExpire: 86400
  # Products Amazon does not know are remembered for notFoundExpire seconds
  # (in memory when Redis is disabled; 0 disables it).
  notFoundExpire: 3600
