# Configuration baked into the production Docker image (NODE_ENV=docker).
# Credentials are intentionally empty: provide them through the environment
# variables listed in config/custom-environment-variables.yml.

Amazon:
  credentialId: ""
  credentialSecret: ""
  version: "3.2"
  partnerTag: ""
  marketplace: www.amazon.fr
  condition: New

Server:
  port: 9080
  debug: false
  path: /item
  cors: false
  projectDir: /app/
  httpCache: 604800
  rateLimit: 120
  swagger: false
  # Click beacons per minute and per client IP
  clickRateLimit: 60
  trustProxy: 1

# Disabled by default so that a standalone `docker run` (as in the CI smoke
# test) starts without a Redis server: the server refuses to start when Redis
# is enabled but unreachable. docker-compose.yml sets REDIS_ENABLED=true.
Redis:
  enabled: false
  host: localhost
  port: 6379
  password: ""
  username: ""
  expire: 2630000

# Administration portal and usage statistics (statistics require Redis).
# "enabled" can be set with AMW_ADMIN_ENABLED (custom-environment-variables.yml).
# The password is only read from the AMW_ADMIN_PASSWORD environment variable
# (at least 12 characters); the server refuses to start when it is missing.
# AMW_ADMIN_SECRET sets the token signing key (random at startup otherwise,
# which logs admins out on restart). Both are environment-only on purpose.
# Privacy: only aggregated daily counters (90-day retention) and the URL of the
# pages embedding missing products (without query string) are stored; never an
# IP address, a user agent or a cookie.
Admin:
  enabled: false
  tokenTtl: 3600
  loginRateLimit: 10
