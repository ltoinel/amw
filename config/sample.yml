Amazon:
  credentialId: <YOUR CREDENTIAL ID>
  credentialSecret: <YOUR CREDENTIAL SECRET>
  version: "3.2"
  partnerTag: <YOUR PARTNER TAG>
  marketplace: www.amazon.fr
  condition: New
  # Circuit breaker: after breakerThreshold consecutive Amazon failures, stop
  # calling Amazon for breakerCooldown seconds (stale products are served, or
  # 503 with Retry-After). 0 disables the breaker.
  breakerThreshold: 5
  breakerCooldown: 60

Server:
  port: 8080
  debug: true
  path: /amw
  cors: false
  projectDir: <PATH WHERE THE PROJECT IS INSTALLED>
  httpCache: 3600
  rateLimit: 120
  swagger: false
  metrics: false
  # Click beacons per minute and per client IP
  clickRateLimit: 60
  # Maximum /view beacons per client IP per minute
  viewRateLimit: 120
  trustProxy: false
  # Design of the cards: default, native, shelf, receipt, blueprint, outdoor, terminal,
  # magazine, pastel or neon.
  # A page can choose another one with <script data-theme="...">.
  theme: default
  # Sites that may use the widget: lowercase hosts, with the port if not the default, as
  # www.example.com. Other sites get a 403. Empty allows every site.
  allowedSites: []

Redis:
  enabled: false
  host: localhost
  port: 6379
  password:
  username:
  # Amazon Associates rules require prices less than 24 h old: larger values
  # are capped at 86400.
  expire: 3600
  # Products are kept staleExpire seconds after they expire, to be served when
  # Amazon is down (0 disables it). Never beyond 24 h after the Amazon call.
  staleExpire: 86400
  # Products Amazon does not know are remembered for notFoundExpire seconds
  # (in memory when Redis is disabled; 0 disables it).
  notFoundExpire: 3600

# Widgets without an id: AMW reads the title of the page and Claude chooses the product. Only its
# public title, site and description are sent to Anthropic, and each new page is a billed call. Needs Redis and ANTHROPIC_API_KEY.
Recommendation:
  enabled: false
  # Hosts AMW may fetch pages from (with the port if not the default), required when enabled
  allowedHosts: []
  # Maximum billed calls per UTC day (ten times more page fetches)
  dailyLimit: 100
  # Pages without a product show the most clicked one of their site over 30 days
  fallback: true

# Stuffing: cards widget.js adds to each article, at the end of a paragraph before an h2 or h3 (0 adds none,
# at most 5). They show recommended products, so they need Recommendation.enabled. These are the
# defaults: the Settings view of the administration portal can change them, with Redis.
Stuffing:
  count: 0
  # The id of the element holding the article
  containerId: main-content

# Administration portal and usage statistics (statistics require Redis).
# "enabled" can be set with AMW_ADMIN_ENABLED (custom-environment-variables.yml).
# The password is only read from the AMW_ADMIN_PASSWORD environment variable
# (at least 12 characters); the server refuses to start when it is missing.
# AMW_ADMIN_SECRET sets the token signing key (random at startup otherwise,
# which logs admins out on restart). Both are environment-only on purpose.
# Privacy: only aggregated daily counters (90-day retention) and the URL of the
# pages embedding the widget (without query string) are stored; never an
# IP address, a user agent or a cookie.
Admin:
  enabled: false
  tokenTtl: 3600
  loginRateLimit: 10
  # AI insights in the portal: sends the aggregated statistics of the period (counters,
  # product titles, page URLs without query string) to the Claude API, which bills each
  # analysis. Needs ANTHROPIC_API_KEY in the environment.
  insights: false
