Amazon:
  credentialId: <YOUR CREDENTIAL ID>
  credentialSecret: <YOUR CREDENTIAL SECRET>
  version: "3.2"
  partnerTag: <YOUR PARTNER TAG>
  marketplace: www.amazon.fr
  condition: New

Server:
  port: 8080
  debug: true
  path: /amw
  cors: false
  projectDir: <PATH WHERE THE PROJECT IS INSTALLED>
  httpCache: 3600
  rateLimit: 120
  swagger: false
  # Click beacons per minute and per client IP
  clickRateLimit: 60
  trustProxy: false

Redis:
  enabled: false
  host: localhost
  port: 6379
  password:
  username:
  expire: 3600

# Administration portal and usage statistics (statistics require Redis).
# "enabled" can be set with AMW_ADMIN_ENABLED (custom-environment-variables.yml).
# The password is only read from the AMW_ADMIN_PASSWORD environment variable
# (at least 12 characters); the server refuses to start when it is missing.
# AMW_ADMIN_SECRET sets the token signing key (random at startup otherwise,
# which logs admins out on restart). Both are environment-only on purpose.
# Privacy: only aggregated daily counters (90-day retention) and the URL of the
# pages embedding missing products (without query string) are stored; never an
# IP address, a user agent or a cookie.
Admin:
  enabled: false
  tokenTtl: 3600
  loginRateLimit: 10
