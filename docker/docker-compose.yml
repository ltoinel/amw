version: '3.8'

services:
  amw:
    build: .
    container_name: amw-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=production
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      # Mount configuration file (customize as needed)
      - ./config/production.yml:/app/config/production.yml:ro
      # Mount logs directory for persistence
      - ./logs:/app/logs
    depends_on:
      - redis
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/amw/product?keyword=test"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - amw-network

  redis:
    image: redis:7-alpine
    container_name: amw-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      # Persist Redis data
      - redis-data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 3s
      retries: 3
    networks:
      - amw-network

  # Optional: Nginx reverse proxy
  nginx:
    image: nginx:alpine
    container_name: amw-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Mount your nginx configuration
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      # Mount SSL certificates if using HTTPS
      # - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - amw
    networks:
      - amw-network

volumes:
  redis-data:
    driver: local

networks:
  amw-network:
    driver: bridge