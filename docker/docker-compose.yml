services:
  # AMW Application
  amw:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: amw
    # Loopback only: config/docker.yml trusts one proxy hop (Server.trustProxy: 1),
    # so a client reaching the container directly could forge X-Forwarded-For and
    # bypass every per-IP rate limit. The reverse proxy on the host connects here.
    ports:
      - "127.0.0.1:9080:9080"
    # Amazon credentials (see .env.example); optional so that the stack can be
    # started before .env exists
    env_file:
      - path: ../.env
        required: false
    # These take precedence over env_file: Redis is the service below
    environment:
      - NODE_ENV=docker
      - REDIS_ENABLED=true
      - REDIS_HOST=redis
    depends_on:
      redis:
        # The server exits at startup if Redis is enabled but unreachable
        condition: service_healthy
    restart: unless-stopped
    # AMW writes nothing to disk and needs no Linux capability: a compromised process can
    # neither persist files nor regain privileges
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9080/item/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Redis Cache
  redis:
    image: redis:8-alpine
    container_name: redis
    # REDIS_PASSWORD comes from the same .env as AMW's, which reads it as Redis.password
    env_file:
      - path: ../.env
        required: false
    volumes:
      - redis-data:/data
      - ./config/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    restart: unless-stopped
    # The image entrypoint drops root itself (gosu), which no-new-privileges still allows
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          # maxmemory (256mb) plus room for the copy-on-write fork of AOF/RDB rewrites
          memory: 512M
    # Any container of the network could otherwise rewrite the cached products, hence the
    # links the widgets render: Redis refuses to start without a password. The image
    # entrypoint is called again so that it still drops root before starting Redis.
    command:
      - sh
      - -c
      - ': "$${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}"; exec docker-entrypoint.sh redis-server /usr/local/etc/redis/redis.conf --requirepass "$$REDIS_PASSWORD"'
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  redis-data:
    driver: local
