services:
  # AMW Application
  amw:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: amw
    ports:
      - "9080:9080"
    # Amazon credentials (see .env.example); optional so that the stack can be
    # started before .env exists
    env_file:
      - path: ../.env
        required: false
    # These take precedence over env_file: Redis is the service below
    environment:
      - NODE_ENV=docker
      - REDIS_ENABLED=true
      - REDIS_HOST=redis
    depends_on:
      redis:
        # The server exits at startup if Redis is enabled but unreachable
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9080/item/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Redis Cache
  redis:
    image: redis:8-alpine
    container_name: redis
    volumes:
      - redis-data:/data
      - ./config/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    restart: unless-stopped
    command: redis-server /usr/local/etc/redis/redis.conf
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  redis-data:
    driver: local
