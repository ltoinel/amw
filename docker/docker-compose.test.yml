version: '3.8'

services:
  # AMW Test Runner
  amw-test:
    build:
      context: ..
      dockerfile: docker/Dockerfile.test
    container_name: amw-test
    volumes:
      - ../coverage:/app/coverage
    environment:
      - NODE_ENV=test
      - CI=true
      - REDIS_URL=redis://redis-test:6379
    depends_on:
      - redis-test
    networks:
      - amw-test-network

  # Redis for Testing
  redis-test:
    image: redis:7-alpine
    container_name: redis-test
    networks:
      - amw-test-network
    command: redis-server --appendonly no --save ""

  # Test Linting Service
  amw-lint:
    build:
      context: ..
      dockerfile: docker/Dockerfile.test
    container_name: amw-lint
    environment:
      - NODE_ENV=test
    networks:
      - amw-test-network
    command: ["npm", "run", "lint"]

  # Test Build Service
  amw-build:
    build:
      context: ..
      dockerfile: docker/Dockerfile.test
    container_name: amw-build
    volumes:
      - ../dist:/app/dist
    environment:
      - NODE_ENV=production
    networks:
      - amw-test-network
    command: ["npm", "run", "build"]

networks:
  amw-test-network:
    driver: bridge