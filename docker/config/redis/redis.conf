# Redis Production Configuration for AMW
# Optimized for performance and persistence

# Network and Security
bind 0.0.0.0
port 6379
# The password is passed by docker/docker-compose.yml (--requirepass, from
# REDIS_PASSWORD); protected mode only matters for a server without one.
protected-mode yes

# General Configuration
daemonize no
supervised no
pidfile /var/run/redis_6379.pid
loglevel notice
logfile ""
databases 16

# Persistence Configuration
# Snapshot after 900 s if >= 1 key changed, 300 s if >= 10, 60 s if >= 10000.
# Redis has no trailing comments: text after a value is parsed as arguments.
save 900 1
save 300 10
save 60 10000

stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /data

# AOF Configuration (Append Only File)
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
aof-load-truncated yes
aof-use-rdb-preamble yes

# Memory Management
maxmemory 256mb
maxmemory-policy allkeys-lru
maxmemory-samples 5

# Lazy Freeing
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes
replica-lazy-flush yes

# Threading (Redis 6.0+)
# io-threads 2
# io-threads-do-reads yes

# Slow Log
slowlog-log-slower-than 10000
slowlog-max-len 128

# Client Configuration
timeout 300
tcp-keepalive 300
tcp-backlog 511

# Performance Tuning
hz 10
dynamic-hz yes

# Security (Production)
# requirepass is set on the command line by docker/docker-compose.yml
# rename-command FLUSHDB ""
# rename-command FLUSHALL ""
# rename-command DEBUG ""
# rename-command CONFIG "CONFIG_b4f2a9c8e5d6"

# Modules (if needed)
# loadmodule /path/to/module.so

# AMW-specific settings
# Set appropriate key expiration for AMW cache
# These settings are optimized for AMW's Amazon PAAPI caching needs