name: 🧹 Maintenance

on:
  schedule:
    # Run every Monday at 3 AM UTC
    - cron: '0 3 * * 1'
  workflow_dispatch:
    inputs:
      task:
        description: 'Maintenance task to run'
        required: true
        type: choice
        options:
          - dependency-update
          - security-scan
          - docker-cleanup
          - all

jobs:
  dependency-update:
    name: 📦 Update Dependencies
    runs-on: ubuntu-latest
    if: github.event.inputs.task == 'dependency-update' || github.event.inputs.task == 'all' || github.event.schedule
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Check for dependency updates
        run: |
          npx npm-check-updates --upgrade --target minor
          npm install

      - name: 🧪 Run tests after update
        run: |
          npm run build
          npm test

      - name: 📝 Create pull request
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: '⬆️ Update dependencies'
          title: '⬆️ Automated dependency update'
          body: |
            🤖 Automated dependency update
            
            This PR updates minor and patch versions of dependencies.
            
            - ✅ All tests pass
            - ✅ Build successful
            - 🔍 Please review changes carefully
            
            Generated by GitHub Actions
          branch: automation/dependency-update
          delete-branch: true

  security-scan:
    name: 🔒 Security Scan
    runs-on: ubuntu-latest
    if: github.event.inputs.task == 'security-scan' || github.event.inputs.task == 'all' || github.event.schedule
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔒 Run npm audit
        run: npm audit --audit-level high

      - name: 🔍 Run Snyk security scan
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: 🐳 Scan Docker image for vulnerabilities
        run: |
          docker build -t amw-security-scan .
          
          # Install Trivy
          wget https://github.com/aquasecurity/trivy/releases/latest/download/trivy_$(uname -s)_$(uname -m).tar.gz
          tar zxvf trivy_*.tar.gz
          sudo mv trivy /usr/local/bin/
          
          # Scan image
          trivy image --exit-code 1 --severity HIGH,CRITICAL amw-security-scan

  docker-cleanup:
    name: 🐳 Docker Registry Cleanup
    runs-on: ubuntu-latest
    if: github.event.inputs.task == 'docker-cleanup' || github.event.inputs.task == 'all' || github.event.schedule
    permissions:
      packages: write
    steps:
      - name: 🧹 Clean up old Docker images
        uses: actions/delete-package-versions@v4
        with:
          package-name: amw
          package-type: container
          min-versions-to-keep: 10
          delete-only-untagged-versions: true

  code-quality:
    name: 📊 Code Quality Report
    runs-on: ubuntu-latest
    if: github.event.schedule || github.event.inputs.task == 'all'
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔍 Run comprehensive linting
        run: npm run lint > lint-report.txt 2>&1 || true

      - name: 🧪 Generate test coverage
        run: npm run test:coverage

      - name: 📊 Generate quality report
        run: |
          echo "# 📊 AMW Code Quality Report" > quality-report.md
          echo "" >> quality-report.md
          echo "Generated on: $(date)" >> quality-report.md
          echo "" >> quality-report.md
          
          echo "## 🧪 Test Results" >> quality-report.md
          npm test 2>&1 | tail -n 10 >> quality-report.md
          echo "" >> quality-report.md
          
          echo "## 🔍 Lint Results" >> quality-report.md
          echo "\`\`\`" >> quality-report.md
          cat lint-report.txt >> quality-report.md
          echo "\`\`\`" >> quality-report.md
          echo "" >> quality-report.md
          
          echo "## 📦 Dependencies" >> quality-report.md
          echo "### Production Dependencies" >> quality-report.md
          npm list --prod --depth=0 >> quality-report.md 2>&1 || true
          echo "" >> quality-report.md
          
          echo "### Outdated Packages" >> quality-report.md
          npm outdated >> quality-report.md 2>&1 || true

      - name: 📤 Upload quality report
        uses: actions/upload-artifact@v4
        with:
          name: quality-report-${{ github.sha }}
          path: |
            quality-report.md
            coverage/
            lint-report.txt

  performance-test:
    name: ⚡ Performance Test
    runs-on: ubuntu-latest
    if: github.event.schedule || github.event.inputs.task == 'all'
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🏗️ Build application
        run: npm run build

      - name: 🚀 Start AMW server
        run: |
          npm start &
          sleep 10

      - name: ⚡ Run performance tests
        run: |
          # Install Apache Bench
          sudo apt-get update
          sudo apt-get install -y apache2-utils
          
          # Basic performance test
          echo "🧪 Testing AMW API performance..."
          ab -n 100 -c 10 http://localhost:8080/amw/product?keyword=test > performance-report.txt
          
          # Display results
          cat performance-report.txt

      - name: 📤 Upload performance report
        uses: actions/upload-artifact@v4
        with:
          name: performance-report-${{ github.sha }}
          path: performance-report.txt

  summary:
    name: 📋 Maintenance Summary
    runs-on: ubuntu-latest
    needs: [dependency-update, security-scan, docker-cleanup, code-quality, performance-test]
    if: always()
    steps:
      - name: 📋 Create maintenance summary
        run: |
          echo "🧹 AMW Maintenance Summary"
          echo "=========================="
          echo "Date: $(date)"
          echo ""
          echo "📦 Dependency Update: ${{ needs.dependency-update.result || 'skipped' }}"
          echo "🔒 Security Scan: ${{ needs.security-scan.result || 'skipped' }}"
          echo "🐳 Docker Cleanup: ${{ needs.docker-cleanup.result || 'skipped' }}"
          echo "📊 Code Quality: ${{ needs.code-quality.result || 'skipped' }}"
          echo "⚡ Performance Test: ${{ needs.performance-test.result || 'skipped' }}"