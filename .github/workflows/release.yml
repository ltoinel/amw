name: 🚀 Release
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-test:
    name: 🏗️ Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
      latest: ${{ steps.version.outputs.latest }}
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Every tag, to tell whether this version is the newest one (see "Get version")
          fetch-depth: 0

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      # Same gate as ci.yml: a release tag must not ship a dependency with a known vulnerability
      - name: 🔒 Run security audit
        run: npm audit --audit-level high

      - name: 🔍 Lint code
        run: npm run lint

      - name: 🏗️ Build project
        run: npm run build

      - name: 🧪 Run tests
        run: npm run test:ci

      - name: 📋 Get version
        id: version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        # The version becomes image tags and the release tag: anything but vX.Y.Z is
        # rejected, which also keeps newlines from injecting extra GITHUB_OUTPUT entries
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            version="${INPUT_VERSION}"
          else
            version="${GITHUB_REF#refs/tags/}"
          fi
          if [[ ! "${version}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid version '${version}': expected vX.Y.Z"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          # "latest" moves only on a tag push of the newest vX.Y.Z tag: a manual run, or the
          # tag of a fix to an older line, must not point it back to an older image
          newest="$(git tag --list 'v*.*.*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)"
          if [[ "${{ github.event_name }}" == "push" && "${version}" == "${newest}" ]]; then
            echo "latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "latest=false" >> "$GITHUB_OUTPUT"
            echo "::notice::${version} is not the newest release tag (${newest}) or was not pushed as a tag: 'latest' is left unchanged"
          fi

      - name: 📤 Upload build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-artifacts
          path: |
            dist/
            package*.json
            README.md
            LICENSE

  # Nothing is published before the image passes the same Trivy scan as ci.yml: OS packages
  # and the Node.js runtime of the image, which npm audit does not cover
  image-scan:
    name: 🔍 Scan Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build-and-test
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # amd64 only and loaded locally: the multi-arch build of the next job reuses its cache
      - name: 🏗️ Build Docker image (scan)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: amw:scan
          build-args: |
            AMW_REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Only vulnerabilities with a fix fail the release: the others cannot be acted upon
      - name: 🔍 Scan the image for vulnerabilities (Trivy)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa \
            image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed --no-progress amw:scan

  docker-build-push:
    name: 🐳 Build & Push Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [build-and-test, image-scan]
    permissions:
      contents: read
      packages: write
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: 🔑 Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🔑 Log in to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 🏷️ Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
            ${{ secrets.DOCKERHUB_USERNAME }}/amw
          # "latest" is set below only when build-and-test found this version to be the newest
          flavor: |
            latest=false
          # The version comes from the job output so that workflow_dispatch
          # releases (no git tag ref) also get versioned tags
          tags: |
            type=semver,pattern={{version}},value=${{ needs.build-and-test.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.build-and-test.outputs.version }}
            type=semver,pattern={{major}},value=${{ needs.build-and-test.outputs.version }}
            type=raw,value=latest,enable=${{ needs.build-and-test.outputs.latest == 'true' }}

      - name: 🏗️ Build and push Docker image to GitHub and Docker Hub
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Shown in the admin portal footer, same date as the image's created label
          build-args: |
            AMW_REVISION=${{ github.sha }}
            AMW_BUILD_DATE=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # SLSA build provenance and SBOM attestations, pushed with the image
          provenance: mode=max
          sbom: true

  npm-publish:
    name: 📦 Publish to NPM
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build-and-test, image-scan]
    permissions:
      contents: read
      # OIDC token used by npm to sign the provenance statement (and, once
      # configured on npmjs.com, for trusted publishing without NPM_TOKEN)
      id-token: write
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🏗️ Build project
        run: npm run build

      - name: 📤 Publish to NPM
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  github-release:
    name: 📦 Create GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build-and-test, docker-build-push, npm-publish]
    permissions:
      contents: write
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: 📥 Download build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-artifacts
          path: ./artifacts

      - name: 📦 Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ needs.build-and-test.outputs.version }}
          name: AMW ${{ needs.build-and-test.outputs.version }}
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
