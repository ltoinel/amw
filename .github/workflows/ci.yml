name: 🧪 CI - Tests and Quality

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

# A new commit on a pull request supersedes the running checks. Pushes to main
# and develop are never cancelled, so every merged commit gets a full CI run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: 🧪 Tests & Linting
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    strategy:
      matrix:
        node-version: [26]

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🔧 Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔍 Lint TypeScript code
        run: npm run lint

      - name: 🏗️ Build project
        run: npm run build

      - name: 🧪 Run tests with coverage
        run: npm run test:ci

      # always(): the report is most useful when the coverage threshold has just failed the job
      - name: 📊 Write coverage summary
        if: always() && hashFiles('coverage/coverage-summary.json') != ''
        run: |
          node -e '
            const summary = require("./coverage/coverage-summary.json");
            const pct = (m) => `${m.pct}%`;
            const rows = Object.entries(summary).map(([file, m]) => {
              const name = file === "total" ? "**Total**" : file.replace(process.cwd() + "/", "");
              return `| ${name} | ${pct(m.statements)} | ${pct(m.branches)} | ${pct(m.functions)} | ${pct(m.lines)} |`;
            });
            console.log(["## Test coverage", "", "| File | Statements | Branches | Functions | Lines |", "|---|---|---|---|---|", ...rows].join("\n"));
          ' >> "$GITHUB_STEP_SUMMARY"

      - name: 📤 Upload coverage report
        if: always() && hashFiles('coverage/coverage-summary.json') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  security:
    name: 🔒 Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔒 Run security audit
        run: npm audit --audit-level high

  dockerfile:
    name: 🐳 Docker Build Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: 🏗️ Build Docker image (test)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          push: false
          tags: amw:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: true

      - name: 🧪 Test Docker container startup and health
        run: |
          chmod +x scripts/test-docker.sh
          ./scripts/test-docker.sh

  e2e:
    name: 🌐 End-to-End Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      REDIS_HOST: localhost
      REDIS_PORT: 6379

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🏗️ Build project
        run: npm run build

      - name: 🌐 Run API end-to-end tests
        run: npm run test:e2e -- --ci

      - name: 🎭 Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: 🎭 Run browser end-to-end tests
        run: npm run test:e2e:browser

      - name: 📤 Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-traces
          path: test-results/e2e-browser/
          retention-days: 7

  quality-gate:
    name: ✅ Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [test, security, dockerfile, e2e]
    if: always()
    steps:
      - name: ✅ Check quality gate
        run: |
          if [[ "${{ needs.test.result }}" != "success" || "${{ needs.security.result }}" != "success" || "${{ needs.dockerfile.result }}" != "success" || "${{ needs.e2e.result }}" != "success" ]]; then
            echo "❌ Quality gate failed"
            exit 1
          fi
          echo "✅ Quality gate passed"