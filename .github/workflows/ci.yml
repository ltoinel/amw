name: 🧪 CI - Tests and Quality

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

jobs:
  test:
    name: 🧪 Tests & Linting
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [24]

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔍 Lint TypeScript code
        run: npm run lint

      - name: 🏗️ Build project
        run: npm run build

      - name: 🧪 Run tests with coverage
        run: npm run test:ci

      # always(): the report is most useful when the coverage threshold has just failed the job
      - name: 📊 Write coverage summary
        if: always() && hashFiles('coverage/coverage-summary.json') != ''
        run: |
          node -e '
            const summary = require("./coverage/coverage-summary.json");
            const pct = (m) => `${m.pct}%`;
            const rows = Object.entries(summary).map(([file, m]) => {
              const name = file === "total" ? "**Total**" : file.replace(process.cwd() + "/", "");
              return `| ${name} | ${pct(m.statements)} | ${pct(m.branches)} | ${pct(m.functions)} | ${pct(m.lines)} |`;
            });
            console.log(["## Test coverage", "", "| File | Statements | Branches | Functions | Lines |", "|---|---|---|---|---|", ...rows].join("\n"));
          ' >> "$GITHUB_STEP_SUMMARY"

      - name: 📤 Upload coverage report
        if: always() && hashFiles('coverage/coverage-summary.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  security:
    name: 🔒 Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔒 Run security audit
        run: npm audit --audit-level high

  dockerfile:
    name: 🐳 Docker Build Test
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🏗️ Build Docker image (test)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: false
          tags: amw:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: true

      - name: 🧪 Test Docker container startup and health
        run: |
          chmod +x scripts/test-docker.sh
          ./scripts/test-docker.sh

  e2e:
    name: 🌐 End-to-End Tests
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      REDIS_HOST: localhost
      REDIS_PORT: 6379

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🏗️ Build project
        run: npm run build

      - name: 🌐 Run API end-to-end tests
        run: npm run test:e2e -- --ci

      - name: 🎭 Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: 🎭 Run browser end-to-end tests
        run: npm run test:e2e:browser

      - name: 📤 Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/e2e-browser/
          retention-days: 7

  quality-gate:
    name: ✅ Quality Gate
    runs-on: ubuntu-latest
    needs: [test, security, dockerfile, e2e]
    if: always()
    steps:
      - name: ✅ Check quality gate
        run: |
          if [[ "${{ needs.test.result }}" != "success" || "${{ needs.security.result }}" != "success" || "${{ needs.dockerfile.result }}" != "success" || "${{ needs.e2e.result }}" != "success" ]]; then
            echo "❌ Quality gate failed"
            exit 1
          fi
          echo "✅ Quality gate passed"