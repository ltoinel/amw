name: 🔄 Auto Deploy

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

jobs:
  determine-environment:
    name: 🎯 Determine Environment
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.env.outputs.environment }}
      should-deploy: ${{ steps.env.outputs.should-deploy }}
    steps:
      - name: 🎯 Set environment
        id: env
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "environment=${{ github.event.inputs.environment }}" >> $GITHUB_OUTPUT
            echo "should-deploy=true" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "environment=production" >> $GITHUB_OUTPUT
            echo "should-deploy=true" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == "refs/heads/develop" ]]; then
            echo "environment=staging" >> $GITHUB_OUTPUT
            echo "should-deploy=true" >> $GITHUB_OUTPUT
          else
            echo "environment=none" >> $GITHUB_OUTPUT
            echo "should-deploy=false" >> $GITHUB_OUTPUT
          fi

  build:
    name: 🏗️ Build Application
    runs-on: ubuntu-latest
    needs: determine-environment
    if: needs.determine-environment.outputs.should-deploy == 'true'
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔍 Lint code
        run: npm run lint

      - name: 🏗️ Build project
        run: npm run build

      - name: 🧪 Run tests
        run: npm run test:ci

      - name: 📤 Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: amw-build-${{ github.sha }}
          path: |
            dist/
            package*.json
            docker/

  docker-build:
    name: 🐳 Build Docker Image
    runs-on: ubuntu-latest
    needs: [determine-environment, build]
    permissions:
      contents: read
      packages: write
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔑 Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏷️ Generate tags
        id: tags
        run: |
          BRANCH=${GITHUB_REF#refs/heads/}
          SHORT_SHA=${GITHUB_SHA:0:7}
          ENV=${{ needs.determine-environment.outputs.environment }}
          
          echo "branch-tag=ghcr.io/${{ github.repository }}:${BRANCH}" >> $GITHUB_OUTPUT
          echo "sha-tag=ghcr.io/${{ github.repository }}:${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "env-tag=ghcr.io/${{ github.repository }}:${ENV}" >> $GITHUB_OUTPUT

      - name: 🏗️ Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.tags.outputs.branch-tag }}
            ${{ steps.tags.outputs.sha-tag }}
            ${{ steps.tags.outputs.env-tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: 🚀 Deploy to ${{ needs.determine-environment.outputs.environment }}
    runs-on: ubuntu-latest
    needs: [determine-environment, build, docker-build]
    environment: ${{ needs.determine-environment.outputs.environment }}
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📥 Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: amw-build-${{ github.sha }}
          path: ./deploy

      - name: 🔧 Setup deployment environment
        run: |
          ENV=${{ needs.determine-environment.outputs.environment }}
          echo "Deploying to: $ENV"
          echo "Image: ghcr.io/${{ github.repository }}:$ENV"

      - name: 🚀 Deploy to server (SSH)
        if: ${{ secrets.DEPLOY_HOST && secrets.DEPLOY_KEY }}
        run: |
          # Install SSH key
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          
          # Add server to known hosts
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts
          
          # Deploy commands
          ENV_TAG=${{ needs.determine-environment.outputs.environment }}
          
          ssh -i ~/.ssh/deploy_key ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} << EOF
            # Navigate to deployment directory
            cd /opt/amw || exit 1
            
            # Pull latest Docker image
            docker pull ghcr.io/${{ github.repository }}:${ENV_TAG}
            
            # Update docker-compose with new image
            sed -i "s|image:.*|image: ghcr.io/${{ github.repository }}:${ENV_TAG}|g" docker-compose.yml
            
            # Restart services
            docker-compose down
            docker-compose up -d
            
            # Cleanup old images
            docker image prune -f
          EOF

      - name: 🚀 Deploy with Docker Compose (Local)
        if: ${{ !secrets.DEPLOY_HOST }}
        run: |
          echo "🚀 Local deployment simulation"
          echo "Environment: ${{ needs.determine-environment.outputs.environment }}"
          echo "Image: ghcr.io/${{ github.repository }}:${{ needs.determine-environment.outputs.environment }}"
          echo "To deploy to a real server, configure these secrets:"
          echo "  - DEPLOY_HOST: Your server hostname/IP"
          echo "  - DEPLOY_USER: SSH username"
          echo "  - DEPLOY_KEY: SSH private key"

      - name: 🔍 Health check
        if: ${{ secrets.DEPLOY_HOST }}
        run: |
          echo "🔍 Performing health check..."
          # Wait for service to start
          sleep 30
          
          # Health check (adjust URL based on your setup)
          curl -f http://${{ secrets.DEPLOY_HOST }}:8080/amw/product?keyword=test || echo "❌ Health check failed"

  notify-success:
    name: ✅ Notify Success
    runs-on: ubuntu-latest
    needs: [determine-environment, deploy]
    if: success()
    steps:
      - name: ✅ Success notification
        run: |
          ENV=${{ needs.determine-environment.outputs.environment }}
          echo "✅ AMW successfully deployed to $ENV!"
          echo "🐳 Image: ghcr.io/${{ github.repository }}:$ENV"
          echo "📊 Commit: ${{ github.sha }}"

  notify-failure:
    name: ❌ Notify Failure
    runs-on: ubuntu-latest
    needs: [determine-environment, build, docker-build, deploy]
    if: failure()
    steps:
      - name: ❌ Failure notification
        run: |
          ENV=${{ needs.determine-environment.outputs.environment }}
          echo "❌ AMW deployment to $ENV failed!"
          echo "📊 Commit: ${{ github.sha }}"
          echo "🔍 Check the workflow logs for details"