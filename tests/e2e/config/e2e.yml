# Base configuration of the end-to-end tests.
# Ports, Server.projectDir and the mock Amazon API URLs are only known at
# runtime and are injected by tests/e2e/support/amwServer.ts via NODE_CONFIG.

Amazon:
  credentialId: e2e-credential-id
  credentialSecret: e2e-credential-secret
  # Quoted: the SDK expects a string (it calls version.startsWith())
  version: "3.1"
  partnerTag: e2e-21
  marketplace: www.amazon.fr
  condition: New

Server:
  debug: false
  path: /amw
  cors: false
  httpCache: 300
  rateLimit: 1000
  trustProxy: false

Redis:
  enabled: false
  host: localhost
  port: 6379
  password:
  username:
  expire: 3600
