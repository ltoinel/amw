<!--
  The default card. A template is markup only: widget.js fills it with textContent and checked
  URLs, never with HTML. Elements are found by class, as in the default:
  required  .amw-widget-main-link (the link of the card), .amw-widget-img, .amw-widget-caption,
            .amw-widget-price, .amw-widget-timestamp, .amw-widget-content, .amw-widget-body,
            .amw-widget-spinner
  optional  .amw-widget-btn-warning (the call to action), .amw-widget-disclosure (removed when the
            site turns the disclosure off), .amw-widget-banner
  data-amw-text="buy | loading | notice" gets that text of the card's language.
  No src on the image until the product is known: an empty src makes some browsers request the
  page. width/height give a square aspect ratio until the image is decoded, so the card does not
  grow when it arrives. The whole card is one link, named by the title, the price and the notice:
  the image is decorative, the button and the banner repeat the link, and the update date and the
  disclosure describe it (aria-describedby, set by widget.js).
-->
<a href="#" class="amw-widget-main-link" target="_blank" rel="sponsored nofollow">
    <div class="amw-widget-img-container">
        <img alt="" class="amw-widget-img" loading="lazy" decoding="async" width="160" height="160">
    </div>

    <div class="amw-widget-content">
        <div class="amw-widget-body">
            <div class="amw-widget-title">
                <span class="amw-widget-caption"></span>
            </div>

            <div class="amw-widget-buttons">
                <span class="amw-widget-btn amw-widget-btn-success amw-widget-price"></span>
                <span class="amw-widget-btn amw-widget-btn-warning" aria-hidden="true" data-amw-text="buy"></span>
            </div>

            <p class="amw-widget-text">
                <span class="amw-widget-timestamp" aria-hidden="true"></span>
                <span class="amw-widget-disclosure" aria-hidden="true"></span>
            </p>
            <span class="amw-widget-visually-hidden" data-amw-text="notice"></span>
        </div>

        <div class="amw-widget-banner" aria-hidden="true">
           #Amazon
        </div>
    </div>
</a>

<div class="amw-widget-spinner">
    <div class="amw-widget-spinner-grow" role="status">
        <span class="amw-widget-visually-hidden" data-amw-text="loading"></span>
    </div>
</div>
